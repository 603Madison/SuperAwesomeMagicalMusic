[package]
name = "superawesomemagicalmusic"
version = "1.26.0"
edition = "2024"
description = "Your SuperAwesomeMagicalMusic server on the Linux desktop"
license = "GPL-3.0-only"
homepage = "https://github.com/603Madison/SuperAwesomeMagicalMusic"
repository = "https://github.com/603Madison/SuperAwesomeMagicalMusic"
readme = "README.md"
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
base64 = "0.23.1"
gst = { version = "0.25.4", package = "gstreamer" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
mpris-server = "0.11.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
