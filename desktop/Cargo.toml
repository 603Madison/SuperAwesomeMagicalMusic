[package]
name = "superawesomemagicalmusic"
version = "1.28.0"
edition = "2024"
description = "Your SuperAwesomeMagicalMusic server on the Linux desktop"
license = "GPL-3.0-only"
homepage = "https://github.com/603Madison/SuperAwesomeMagicalMusic"
repository = "https://github.com/603Madison/SuperAwesomeMagicalMusic"
readme = "README.md"
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
base64 = "0.23.1"
gst = { version = "0.25.4", package = "gstreamer" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
mpris-server = "0.11.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# `cargo deb`: the package for Ubuntu (24.04 and later), Debian 13, Mint 22, Pop!_OS 24.04.
[package.metadata.deb]
name = "superawesomemagicalmusic"
maintainer = "SuperAwesomeMagicalMusic <superawesomemagicalmusic@users.noreply.github.com>"
copyright = "SuperAwesomeMagicalMusic contributors"
section = "sound"
priority = "optional"
extended-description = "Your SuperAwesomeMagicalMusic server on the desktop: your library, YouTube Music, SiriusXM channels and radio, played natively with GTK and GStreamer."
# The libraries it links (worked out by dpkg-shlibdeps), and GStreamer's plug-ins for HLS, AAC, FLAC and Opus.
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
assets = [
    ["target/release/superawesomemagicalmusic", "usr/bin/", "755"],
    ["data/io.github._603madison.SuperAwesomeMagicalMusic.desktop", "usr/share/applications/", "644"],
    ["data/io.github._603madison.SuperAwesomeMagicalMusic.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/16x16/apps/*", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["data/icons/hicolor/24x24/apps/*", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["data/icons/hicolor/32x32/apps/*", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/hicolor/48x48/apps/*", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/hicolor/64x64/apps/*", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/hicolor/128x128/apps/*", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/*", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/*", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

# `cargo generate-rpm`: the package for Fedora (40 and later) and others with dnf.
[package.metadata.generate-rpm]
name = "superawesomemagicalmusic"
summary = "Listen to your SuperAwesomeMagicalMusic server"
assets = [
    { source = "target/release/superawesomemagicalmusic", dest = "/usr/bin/superawesomemagicalmusic", mode = "755" },
    { source = "data/io.github._603madison.SuperAwesomeMagicalMusic.desktop", dest = "/usr/share/applications/io.github._603madison.SuperAwesomeMagicalMusic.desktop", mode = "644" },
    { source = "data/io.github._603madison.SuperAwesomeMagicalMusic.metainfo.xml", dest = "/usr/share/metainfo/io.github._603madison.SuperAwesomeMagicalMusic.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/16x16/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
    { source = "data/icons/hicolor/24x24/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/24x24/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
    { source = "data/icons/hicolor/32x32/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
    { source = "data/icons/hicolor/48x48/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
    { source = "data/icons/hicolor/64x64/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
    { source = "data/icons/hicolor/128x128/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
    { source = "data/icons/hicolor/256x256/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
    { source = "data/icons/hicolor/512x512/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github._603madison.SuperAwesomeMagicalMusic.png", mode = "644" },
]

# Besides the libraries it links (found in the binary): GStreamer's plug-ins for HLS, AAC, FLAC and Opus.
[package.metadata.generate-rpm.requires]
gstreamer1-plugins-base = "*"
gstreamer1-plugins-good = "*"
gstreamer1-plugins-bad-free = "*"
gstreamer1-plugin-libav = "*"
