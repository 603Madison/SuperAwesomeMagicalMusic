name: Release APK

# Builds the signed APK and publishes it as a GitHub release, with notes from
# release-notes/<version>.md, then lists it in the F-Droid repo, adds the Linux desktop app's
# packages and publishes the server's and the tuner's container images to ghcr.io. Start it from the Actions tab ("Run workflow") with the version,
# or push a v* tag. The release's tag is created on the built commit if it doesn't exist yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.1.0 (must match versionName in app/build.gradle.kts)
        required: true
      commit:
        description: Commit to build (defaults to the selected branch's latest commit)
        required: false

# Nothing by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}

      - name: Check version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::$TAG doesn't match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi
          DESKTOP_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          if [ "v$DESKTOP_VERSION" != "$TAG" ]; then
            echo "::error::$TAG doesn't match the desktop app's version $DESKTOP_VERSION in desktop/Cargo.toml"
            exit 1
          fi
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Unit tests (both apps, the server and the tuner)
        run: ./gradlew --no-daemon testDebugUnitTest :server:test :tuner:test

      # From repository secrets, after the tests: code under test never runs beside the key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] && echo "RELEASE_KEYSTORE_BASE64: found" || echo "RELEASE_KEYSTORE_BASE64: missing"
          [ -n "$KEYSTORE_PASSWORD" ] && echo "RELEASE_KEYSTORE_PASSWORD: found" || echo "RELEASE_KEYSTORE_PASSWORD: missing"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions > Repository secrets (not Environment, Dependabot or Codespaces secrets)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The keystore couldn't be opened: check that RELEASE_KEYSTORE_BASE64 was pasted completely and the password matches"
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "SuperAwesomeMagicalMusic-Standalone-$TAG.apk"
          cp connect/build/outputs/apk/release/connect-release.apk "SuperAwesomeMagicalMusic-$TAG.apk"
          sha256sum SuperAwesomeMagicalMusic-*.apk

      # Mini, for flip phones (mini/): built above with the others, attached after them.
      - name: Mini APK
        run: |
          cp mini/build/outputs/apk/release/mini-release.apk "SuperAwesomeMagicalMusic-Mini-$TAG.apk"
          sha256sum "SuperAwesomeMagicalMusic-Mini-$TAG.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes come from the latest branch so older releases can be (re)published too.
          git fetch --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:release-notes/$TAG.md" > notes.md 2>/dev/null || echo "SuperAwesomeMagicalMusic $TAG" > notes.md
          apks=("SuperAwesomeMagicalMusic-$TAG.apk" "SuperAwesomeMagicalMusic-Standalone-$TAG.apk")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${apks[@]}" --clobber
          else
            gh release create "$TAG" "${apks[@]}" --target "$COMMIT" --title "SuperAwesomeMagicalMusic $TAG" --notes-file notes.md
          fi

      - name: Add Mini to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "SuperAwesomeMagicalMusic-Mini-$TAG.apk" --clobber

  # The Linux desktop app (desktop/, Rust with GTK 4 and libadwaita): a .deb for Ubuntu 24.04 and
  # later (Mint 22, Pop!_OS 24.04, Debian 13) and an .rpm for Fedora 40 and later, added to the
  # release. Built on Ubuntu 24.04, the oldest it supports, so it runs on everything newer.
  desktop:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}

      - name: GTK 4, libadwaita and GStreamer to build against
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Test and build the packages
        working-directory: desktop
        run: |
          cargo test --release --locked
          cargo build --release --locked
          cargo deb --no-build
          cargo generate-rpm
          mkdir -p ../out
          cp target/debian/*.deb "../out/SuperAwesomeMagicalMusic-Desktop-$TAG-amd64.deb"
          cp target/generate-rpm/*.rpm "../out/SuperAwesomeMagicalMusic-Desktop-$TAG-x86_64.rpm"
          sha256sum ../out/*

      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/SuperAwesomeMagicalMusic-Desktop-* --clobber

  # Lists the new release in the project's F-Droid repo.
  fdroid:
    needs: release
    uses: ./.github/workflows/fdroid.yml
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write

  # The server and web player, for amd64 and arm64 (a Raspberry Pi), at
  # ghcr.io/<owner>/<repository>:<version> and :latest.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}

      - name: Image name and tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${TAG#v}"
          {
            echo "TAGS<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:${VERSION%.*}"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say where it is
        run: echo "::notice::Published $IMAGE (${TAG#v} and latest)"

  # The FM and HD Radio tuner (tuner/), for amd64 and arm64 (a Raspberry Pi), at
  # ghcr.io/<owner>/<repository>-tuner:<version> and :latest. Its redsea and nrsc5 are compiled
  # in the build, under emulation for arm64, so a first build takes a while; later ones reuse it.
  tuner-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}

      - name: Image name and tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-tuner"
          VERSION="${TAG#v}"
          {
            echo "TAGS<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: tuner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          # Its own cache, apart from the server image's.
          cache-from: type=gha,scope=tuner
          cache-to: type=gha,mode=max,scope=tuner

      - name: Say where it is
        run: echo "::notice::Published $IMAGE (${TAG#v} and latest)"
