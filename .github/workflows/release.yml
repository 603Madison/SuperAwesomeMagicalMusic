name: Release APK

# Builds the signed APK and publishes it as a GitHub release, with notes from
# release-notes/<version>.md. Start it from the Actions tab ("Run workflow") with the version,
# or push a v* tag. The release's tag is created on the built commit if it doesn't exist yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.1.0 (must match versionName in app/build.gradle.kts)
        required: true
      commit:
        description: Commit to build (defaults to the selected branch's latest commit)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Check version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::$TAG doesn't match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Music-$TAG.apk"
          sha256sum "Music-$TAG.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes come from the latest branch so older releases can be (re)published too.
          git fetch --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:release-notes/$TAG.md" > notes.md 2>/dev/null || echo "Music $TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Music-$TAG.apk" --clobber
          else
            gh release create "$TAG" "Music-$TAG.apk" --target "$COMMIT" --title "Music $TAG" --notes-file notes.md
          fi
